name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry run: version to build (e.g. 0.1.0) — signed APK kept as an artifact, no release created"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Derive versionName and versionCode from the tag
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then RAW="${GITHUB_REF_NAME#v}"; else RAW="${{ inputs.version }}"; fi
          IFS=. read -r MAJ MIN PAT <<<"$RAW"
          for part in "$MAJ" "$MIN" "$PAT"; do
            case "$part" in ''|*[!0-9]*) echo "::error::expected vMAJOR.MINOR.PATCH, got '$RAW'"; exit 1;; esac
          done
          # versionCode = major*10000 + minor*100 + patch. Past 99 a component would stop the code
          # increasing monotonically, and an Android build that goes backwards cannot be installed
          # over its predecessor — fail here rather than ship one.
          if [ "$MIN" -ge 100 ] || [ "$PAT" -ge 100 ]; then
            echo "::error::minor and patch must stay below 100 (versionCode monotonicity)"; exit 1
          fi
          echo "name=$RAW" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJ*10000 + MIN*100 + PAT))" >> "$GITHUB_OUTPUT"
          echo "building $RAW (versionCode $((MAJ*10000 + MIN*100 + PAT)))"

      - name: Materialise the signing keystore
        run: printf '%s' "${{ secrets.NABIJI_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/nabiji-release.jks"

      - name: Build the signed, minified APK
        env:
          NABIJI_KEYSTORE_STORE_FILE: ${{ runner.temp }}/nabiji-release.jks
          NABIJI_KEYSTORE_STORE_PASSWORD: ${{ secrets.NABIJI_KEYSTORE_STORE_PASSWORD }}
          NABIJI_KEYSTORE_KEY_ALIAS: ${{ secrets.NABIJI_KEYSTORE_KEY_ALIAS }}
          NABIJI_KEYSTORE_KEY_PASSWORD: ${{ secrets.NABIJI_KEYSTORE_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease :app:lintVitalRelease
          -PversionCode=${{ steps.v.outputs.code }}
          -PversionName=${{ steps.v.outputs.name }}
          --stacktrace

      # The build falls back to an unsigned APK when the credentials are absent, which is right
      # for a fresh checkout and wrong for a release. Without this check a missing secret would
      # publish an APK nobody can install as an update.
      - name: Verify the APK is signed and aligned
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK is missing — the build produced an unsigned APK, so the NABIJI_KEYSTORE_* secrets are not set"
            exit 1
          fi
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$TOOLS/zipalign" -c -v 4 "$APK" > /dev/null
          "$TOOLS/apksigner" verify --print-certs "$APK"

      - name: Name the APK after the version
        id: apk
        run: |
          DEST="nabiji-${{ steps.v.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      # Every crash report from this build arrives as obfuscated class names. Without the mapping
      # kept alongside the release, those stack traces can never be read back.
      - name: Keep the R8 mapping (90 days)
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ steps.v.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Keep the APK as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: nabiji-${{ steps.v.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Attach the APK to the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.path }}" \
            --title "Nabiji ${{ steps.v.outputs.name }}" \
            --generate-notes
