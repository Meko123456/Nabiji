name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, lint and unit tests
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --stacktrace

      # R8 and resource shrinking only run for release, so a debug-only CI lets the release build
      # rot until the day you try to ship. Health Connect and Glance both reach for classes
      # reflectively, which is exactly what a shrinker removes.
      - name: Release build (R8 + resource shrinking)
        run: ./gradlew :app:assembleRelease :app:lintVitalRelease --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
